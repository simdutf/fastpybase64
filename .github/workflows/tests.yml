name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -v ".[test]"

      - name: Test
        run: python -m pytest tests -v

  pyodide:
    # WebAssembly: 32-bit, no SIMD, no threads. cibuildwheel builds the
    # wheels and runs the tests in Node.
    name: Pyodide (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_PLATFORM: pyodide
