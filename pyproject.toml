[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpybase64"
version = "0.1.1"
description = "Fast Base64 encoding and decoding for Python, built on simdutf"
readme = "README.md"
authors = [
    {name = "Daniel Lemire", email = "daniel@lemire.me"}
]
requires-python = ">=3.10"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "vendor/simdutf-LICENSE-APACHE", "vendor/simdutf-LICENSE-MIT"]
keywords = ["base64", "simdutf", "simd", "performance", "encoding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/simdutf/fastpybase64"
Repository = "https://github.com/simdutf/fastpybase64"
Issues = "https://github.com/simdutf/fastpybase64/issues"

[project.optional-dependencies]
test = ["pytest"]
bench = ["pybase64"]

[tool.setuptools]
py-modules = []

[tool.cibuildwheel]
skip = ["pp*"]
test-requires = ["pytest"]
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.macos]
# Build for Intel, Apple Silicon, and Universal2 binaries
archs = ["x86_64", "universal2", "arm64"]

[tool.cibuildwheel.linux]
# Build for the runner's native architecture (x86_64 and aarch64 runners
# are provided separately in the CI matrix, so each builds natively).
archs = ["native"]

[tool.cibuildwheel.windows]
# Build for 64-bit Windows (32-bit is rarely needed nowadays)
archs = ["AMD64"]
